<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nuevo producto | OmniModa</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0&icon_names=steps"
    />
    <link rel="stylesheet" th:href="@{/css/sweetalert2.min.css}" />
    <link rel="stylesheet" th:href="@{/css/nuevo_producto.css}" />
    <link rel="stylesheet" th:href="@{/css/dashboard.css}" />
  </head>
  <body>
    <div class="app">
      <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
      <main class="main-content">
        <header class="page-header">
          <div>
            <h2>Nuevo producto</h2>
            <p>Registra un nuevo producto en el inventario.</p>
          </div>
          <aside th:replace="~{fragments/user_profile :: user_profile}"></aside>
        </header>
        <a href="/productos" class="back-link">
          <i class="fa-solid fa-arrow-left"></i>
          Volver a productos
        </a>
        <section class="form-card">
          <div class="form-header">
            <div class="form-icon">
              <i class="fa-solid fa-box"></i>
            </div>
            <div>
              <h3>Información del producto</h3>
              <p>Completa los datos para registrar el producto.</p>
            </div>
          </div>
          <form
            th:action="@{/productos/guardar}"
            th:object="${producto}"
            class="save-product"
            method="post"
            autocomplete="off"
          >
            <div class="form-grid">
              <div class="form-group">
                <label for="codigo">
                  Código
                  <span>*</span>
                </label>
                <div class="input-wrapper">
                  <i class="fa-solid fa-barcode"></i>
                  <input
                    type="text"
                    id="codigo"
                    th:field="*{codigo}"
                    placeholder="001"
                    maxlength="40"
                    readonly
                    required
                  />
                </div>
              </div>
              <div class="form-group full-width">
                <label>
                  Categoría
                  <span>*</span>
                </label>
                <div class="custom-select" id="categoriaCustom">
                  <select
                    id="categoria"
                    name="categoriaId"
                    class="real-select"
                    required
                  >
                    <option value="">Seleccionar categoría</option>
                    <option
                      th:each="categoria : ${categorias}"
                      th:value="${categoria.idTipoCategoria}"
                      th:text="${categoria.tipo}"
                    ></option>
                  </select>
                  <button type="button" class="custom-select-trigger">
                    <span class="custom-select-left">
                      <span class="custom-select-icon">
                        <i class="fa-solid fa-tags"></i>
                      </span>
                      <span
                        class="custom-select-text placeholder"
                        id="categoriaText"
                      >
                        Seleccionar categoría
                      </span>
                    </span>
                    <i class="fa-solid fa-chevron-down custom-select-arrow"></i>
                  </button>
                  <div class="custom-select-dropdown">
                    <div
                      class="custom-select-options"
                      id="categoriaOptions"
                    ></div>
                  </div>
                </div>
              </div>
              <div class="form-group">
                <label for="nombre">
                  Nombre
                  <span>*</span>
                </label>
                <div class="input-wrapper">
                  <i class="fa-solid fa-shirt"></i>
                  <input
                    type="text"
                    id="nombre"
                    th:field="*{nombre}"
                    placeholder="Ej. Camiseta básica"
                    oninput="validarTexto(this)"
                    maxlength="40"
                    required
                  />
                </div>
              </div>
              <div class="form-group">
                <label for="talla"> Talla </label>
                <div class="custom-select" id="tallaCustom">
                  <select id="talla" th:field="*{talla}" class="real-select">
                    <option value="">Selecciona una talla</option>
                  </select>
                  <button type="button" class="custom-select-trigger">
                    <span class="custom-select-left">
                      <span class="custom-select-icon">
                        <i class="fa-solid fa-ruler"></i>
                      </span>
                      <span
                        class="custom-select-text placeholder"
                        id="tallaText"
                      >
                        Selecciona una talla
                      </span>
                    </span>
                    <i class="fa-solid fa-chevron-down custom-select-arrow"></i>
                  </button>
                  <div class="custom-select-dropdown">
                    <div class="custom-select-options" id="tallaOptions"></div>
                  </div>
                </div>
              </div>
              <div class="form-group">
                <label for="color">Color</label>
                <div class="color-selector-container">
                  <div id="colorSelector" class="color-selector">
                    <span
                      id="selectedColorCircle"
                      class="selected-color-circle"
                    >
                    </span>
                    <span id="selectedColorText" class="selected-color-text">
                      Seleccionar color
                    </span>
                    <i class="fa-solid fa-chevron-down color-arrow"></i>
                  </div>
                  <div id="colorDropdown" class="color-dropdown">
                    <div class="color-search-wrapper">
                      <i class="fa-solid fa-magnifying-glass"></i>
                      <input
                        type="text"
                        id="colorSearch"
                        placeholder="Buscar color..."
                        oninput="validarTexto(this)"
                        autocomplete="off"
                      />
                    </div>
                    <div id="colorList" class="color-list"></div>
                  </div>
                  <input type="hidden" id="color" th:field="*{color}" />
                </div>
              </div>
              <div class="form-group">
                <label for="precio">
                  Precio
                  <span>*</span>
                </label>
                <div class="input-wrapper">
                  <i class="fa-solid fa-dollar-sign"></i>
                  <input
                    type="number"
                    id="precio"
                    th:field="*{precio}"
                    placeholder="0"
                    min="0"
                    step="0.01"
                    oninput="validarPrecio(this)"
                    required
                  />
                </div>
              </div>
              <div class="form-group">
                <label for="stockDisponible">
                  Stock disponible
                  <span>*</span>
                </label>
                <div class="input-wrapper">
                  <i class="fa-solid fa-boxes-stacked"></i>
                  <input
                    type="number"
                    id="stockDisponible"
                    th:field="*{stockDisponible}"
                    placeholder="0"
                    oninput="validarNumeros(this)"
                    min="0"
                    required
                  />
                </div>
              </div>
            </div>
            <div class="form-footer">
              <a href="/productos" class="btn-secondary"> Cancelar </a>
              <button type="submit" class="btn-primary">
                <i class="fa-solid fa-check"></i>
                Guardar producto
              </button>
            </div>
          </form>
        </section>
      </main>
    </div>
    <script th:src="@{/js/validaciones.js}"></script>
    <script th:src="@{/js/consecutivo.js}"></script>
    <script th:src="@{/js/categorias.js}"></script>
    <script th:src="@{/js/talla.js}"></script>
    <script th:src="@{/js/colores.js}"></script>
    <script th:src="@{/js/alertas.js}"></script>
    <script th:src="@{/js/sweetalert2.all.min.js}"></script>
  </body>
</html>
