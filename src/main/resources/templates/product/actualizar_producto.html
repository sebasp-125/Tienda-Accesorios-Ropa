<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Actualizar producto | OmniModa</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" th:href="@{/css/sweetalert2.min.css}" />
    <link rel="stylesheet" th:href="@{/css/dashboard.css}" />
    <link rel="stylesheet" th:href="@{/css/actualizar_producto.css}" />
  </head>

  <body>
    <div class="app">
      <!-- SIDEBAR -->
      <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

      <main class="main-content">
        <header class="page-header">
          <div>
            <h2>Actualizar producto</h2>
            <p>Modifica la información del producto seleccionado.</p>
          </div>
          <!-- USER PROFILE -->
          <aside th:replace="~{fragments/user_profile :: user_profile}"></aside>
        </header>

        <!-- VOLVER -->

        <a href="/productos" class="back-link">
          <i class="fa-solid fa-arrow-left"></i>

          Volver a productos
        </a>

        <!-- FORM -->

        <section class="form-card">
          <div class="form-header">
            <div class="form-icon">
              <i class="fa-solid fa-box-open"></i>
            </div>

            <div>
              <h3>Información del producto</h3>
              <p>Actualiza los datos necesarios del producto.</p>
            </div>
          </div>

          <form
            th:action="@{/productos/actualizar}"
            th:object="${producto}"
            class="update-product"
            method="post"
          >
            <div class="form-grid">
              <!-- CÓDIGO -->
              <div class="form-group">
                <label for="codigo"> Código </label>

                <div class="input-wrapper disabled">
                  <i class="fa-solid fa-barcode"></i>
                  <input
                    type="text"
                    id="codigo"
                    th:field="*{codigo}"
                    readonly
                  />
                </div>
              </div>

              <!-- CATEGORÍA -->
              <div class="form-group full-width">
                <label>
                  Categoría
                  <span>*</span>
                </label>

                <div class="custom-select" id="categoriaCustom">
                  <!-- SELECT REAL PARA THYMELEAF -->
                  <select
                    id="categoria"
                    name="categoriaId"
                    class="real-select"
                    required
                  >
                    <option value="">Seleccionar categoría</option>

                    <option
                      th:each="categoria : ${categorias}"
                      th:value="${categoria.idTipoCategoria}"
                      th:text="${categoria.tipo}"
                      th:selected="${producto.categoria != null and producto.categoria.idTipoCategoria == categoria.idTipoCategoria}"
                    ></option>
                  </select>

                  <!-- CAMPO VISIBLE -->
                  <button type="button" class="custom-select-trigger">
                    <span class="custom-select-left">
                      <span class="custom-select-icon">
                        <i class="fa-solid fa-tags"></i>
                      </span>

                      <span
                        class="custom-select-text placeholder"
                        id="categoriaText"
                      >
                        Seleccionar categoría
                      </span>
                    </span>

                    <i class="fa-solid fa-chevron-down custom-select-arrow"></i>
                  </button>

                  <!-- DROPDOWN -->
                  <div class="custom-select-dropdown">
                    <div
                      class="custom-select-options"
                      id="categoriaOptions"
                    ></div>
                  </div>
                </div>
              </div>

              <!-- NOMBRE -->
              <div class="form-group">
                <label for="nombre">
                  Nombre
                  <span>*</span>
                </label>

                <div class="input-wrapper">
                  <i class="fa-solid fa-shirt"></i>

                  <input
                    type="text"
                    id="nombre"
                    th:field="*{nombre}"
                    maxlength="40"
                    required
                  />
                </div>
              </div>

              <!-- TALLA -->
              <div class="form-group">
                <label for="talla"> Talla </label>

                <div class="custom-select" id="tallaCustom">
                  <select
                    id="talla"
                    th:field="*{talla}"
                    class="real-select"
                  ></select>

                  <button type="button" class="custom-select-trigger">
                    <span class="custom-select-left">
                      <span class="custom-select-icon">
                        <i class="fa-solid fa-ruler"></i>
                      </span>

                      <span
                        class="custom-select-text placeholder"
                        id="tallaText"
                      >
                        Selecciona una talla
                      </span>
                    </span>

                    <i class="fa-solid fa-chevron-down custom-select-arrow"></i>
                  </button>

                  <div class="custom-select-dropdown">
                    <div class="custom-select-options" id="tallaOptions"></div>
                  </div>
                </div>
              </div>

              <!-- COLOR -->
              <div class="form-group">
                <label for="color">Color</label>

                <div class="color-selector-container">
                  <!-- SELECTOR PRINCIPAL -->
                  <div id="colorSelector" class="color-selector">
                    <!-- CÍRCULO DEL COLOR -->
                    <span
                      id="selectedColorCircle"
                      class="selected-color-circle"
                    >
                    </span>

                    <!-- NOMBRE DEL COLOR -->
                    <span id="selectedColorText" class="selected-color-text">
                      Seleccionar color
                    </span>

                    <!-- FLECHA -->
                    <i class="fa-solid fa-chevron-down color-arrow"></i>
                  </div>

                  <!-- DROPDOWN -->
                  <div id="colorDropdown" class="color-dropdown">
                    <!-- BUSCADOR -->
                    <div class="color-search-wrapper">
                      <i class="fa-solid fa-magnifying-glass"></i>

                      <input
                        type="text"
                        id="colorSearch"
                        placeholder="Buscar color..."
                        autocomplete="off"
                      />
                    </div>

                    <!-- LISTA DE COLORES -->
                    <div id="colorList" class="color-list"></div>
                  </div>

                  <!-- INPUT REAL PARA THYMELEAF -->
                  <input type="hidden" id="color" th:field="*{color}" />
                </div>
              </div>

              <!-- PRECIO -->
              <div class="form-group">
                <label for="precio">
                  Precio
                  <span>*</span>
                </label>

                <div class="input-wrapper">
                  <i class="fa-solid fa-dollar-sign"></i>
                  <input
                    type="number"
                    id="precio"
                    th:field="*{precio}"
                    min="0"
                    step="0.01"
                    required
                  />
                </div>
              </div>

              <!-- STOCK -->
              <div class="form-group">
                <label for="stockDisponible">
                  Stock disponible
                  <span>*</span>
                </label>

                <div class="input-wrapper">
                  <i class="fa-solid fa-boxes-stacked"></i>
                  <input
                    type="number"
                    id="stockDisponible"
                    th:field="*{stockDisponible}"
                    min="0"
                    required
                  />
                </div>
              </div>
            </div>

            <!-- FOOTER -->
            <div class="form-footer">
              <a href="/productos" class="btn-secondary"> Cancelar </a>
              <button type="submit" class="btn-primary">
                <i class="fa-solid fa-check"></i>
                Guardar cambios
              </button>
            </div>
          </form>
        </section>
      </main>
    </div>
    <script th:inline="javascript">
      const tallaGuardada = /*[[${producto.talla}]]*/ "";
    </script>
    <script th:src="@{/js/categorias.js}"></script>
    <script th:src="@{/js/talla.js}"></script>
    <script th:src="@{/js/colores.js}"></script>
    <script th:src="@{/js/alertas.js}"></script>
    <script th:src="@{/js/sweetalert2.all.min.js}"></script>
  </body>
</html>
