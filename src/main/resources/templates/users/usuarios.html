<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Usuarios | OmniModa</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" th:href="@{/css/sweetalert2.min.css}" />
    <link rel="stylesheet" th:href="@{/css/usuarios.css}" />
    <link rel="stylesheet" th:href="@{/css/dashboard.css}" />
  </head>
  <body>
    <div class="app">
      <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
      <main class="main-content">
        <header class="page-header">
          <div>
            <h2>Aministracion de Usuarios</h2>
            <p>Administra las cuentas y roles de acceso a OmniModa.</p>
          </div>
          <aside th:replace="~{fragments/user_profile :: user_profile}"></aside>
        </header>
        <section class="users-card">
          <div class="users-card-header">
            <div class="header-title">
              <div class="header-icon">
                <i class="fa-solid fa-users-gear"></i>
              </div>
              <div>
                <h3>Usuarios del sistema</h3>
                <p>Gestiona las cuentas registradas y sus permisos.</p>
              </div>
            </div>
            <a th:href="@{/usuarios/nuevo}" class="btn-primary">
              <i class="fa-solid fa-user-plus"></i>
              Nuevo usuario
            </a>
          </div>
          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Usuario</th>
                  <th>Correo</th>
                  <th>Estado</th>
                  <th>Rol</th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="usuario : ${usuarios}">
                  <td>
                    <span class="user-id" th:text="'#' + ${usuario.idUsuario}">
                    </span>
                  </td>
                  <td>
                    <div class="user-cell">
                      <div class="avatar">
                        <i class="fa-solid fa-user"></i>
                      </div>
                      <strong th:text="${usuario.nombreUsuario}"> </strong>
                    </div>
                  </td>
                  <td>
                    <span th:text="${usuario.correo}"> </span>
                  </td>
                  <td>
                    <span
                      class="status-badge"
                      th:classappend="${usuario.estado == 'Activo'} ? 'active' : 'inactive'"
                      th:text="${usuario.estado}"
                    >
                    </span>
                  </td>
                  <td>
                    <span class="role-badge">
                      <i class="fa-solid fa-shield-halved"></i>
                      <span
                        th:text="${@usuariosService.obtenerRolUsuario(usuario)}"
                      >
                      </span>
                    </span>
                  </td>
                  <td>
                    <div class="actions">
                      <a
                        th:href="@{/usuarios/editar/{id}(id=${usuario.idUsuario})}"
                        class="action-btn edit-btn"
                        title="Editar usuario"
                      >
                        <i class="fa-solid fa-pen"></i>
                      </a>
                      <button
                        type="button"
                        class="action-btn delete"
                        title="Eliminar"
                        th:attr="data-id=${usuario.idUsuario}"
                      >
                        <i class="fa-solid fa-trash"></i>
                      </button>
                      <form
                        th:id="'deleteForm-' + ${usuario.idUsuario}"
                        th:action="@{/usuarios/eliminar/{id}(id=${usuario.idUsuario})}"
                        method="post"
                      ></form>
                    </div>
                  </td>
                </tr>
                <tr th:if="${#lists.isEmpty(usuarios)}">
                  <td colspan="6">
                    <div class="empty-state">
                      <div class="empty-icon">
                        <i class="fa-solid fa-users-slash"></i>
                      </div>
                      <h3>No hay usuarios registrados</h3>
                      <p>Comienza creando el primer usuario del sistema.</p>
                      <a th:href="@{/usuarios/nuevo}" class="btn-primary">
                        <i class="fa-solid fa-user-plus"></i>
                        Crear usuario
                      </a>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
    <script th:src="@{/js/alertas.js}"></script>
    <script th:src="@{/js/sweetalert2.all.min.js}"></script>
  </body>
</html>
