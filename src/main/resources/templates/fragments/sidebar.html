<!-- FRAGMENTO SIDEBAR -->
<aside class="sidebar" th:fragment="sidebar">
  <!-- LOGO -->
  <div class="logo">
    <div class="logo-icon">
      <img th:src="@{/img/logo.png}" alt="Logo de la tienda" />
    </div>

    <div>
      <h2>OmniModa</h2>
      <span>Administración y ventas</span>
    </div>
  </div>

  <!-- MENÚ -->
  <nav class="menu">
    <p class="menu-title">PRINCIPAL</p>

    <a
      th:href="@{/dashboard}"
      class="menu-item"
      th:classappend="${paginaActual == 'dashboard'} ? 'active' : ''"
    >
      <span class="icon">
        <i class="fa-solid fa-chart-pie"></i>
      </span>

      <span>Dashboard</span>
    </a>

    <p class="menu-title">GESTIÓN</p>

    <a
      th:href="@{/clientes}"
      class="menu-item"
      th:classappend="${paginaActual == 'clientes'} ? 'active' : ''"
    >
      <span class="icon">
        <i class="fa-solid fa-users"></i>
      </span>

      <span>Clientes</span>
    </a>

    <a
      th:href="@{/productos}"
      class="menu-item"
      th:classappend="${paginaActual == 'productos'} ? 'active' : ''"
    >
      <span class="icon">
        <i class="fa-solid fa-boxes-stacked"></i>
      </span>

      <span>Productos</span>
    </a>

    <a
      th:href="@{/categorias}"
      class="menu-item"
      th:classappend="${paginaActual == 'categorias'} ? 'active' : ''"
    >
      <span class="icon">
        <i class="fa-solid fa-tags"></i>
      </span>

      <span>Categorías</span>
    </a>

    <a
      th:href="@{/proveedores}"
      class="menu-item"
      th:classappend="${paginaActual == 'proveedores'} ? 'active' : ''"
    >
      <span class="icon">
        <i class="fa-solid fa-truck"></i>
      </span>

      <span>Proveedores</span>
    </a>

    <a
      th:href="@{/promociones}"
      class="menu-item"
      th:classappend="${paginaActual == 'promociones'} ? 'active' : ''"
    >
      <span class="icon">
        <i class="fa-solid fa-percent"></i>
      </span>

      <span>Promociones</span>
    </a>

    <p class="menu-title">VENTAS</p>

    <a
      th:href="@{/ventas}"
      class="menu-item"
      th:classappend="${paginaActual == 'ventas'} ? 'active' : ''"
    >
      <span class="icon">
        <i class="fa-solid fa-cart-shopping"></i>
      </span>

      <span>Ventas</span>
    </a>

    <p class="menu-title">ADMINISTRACIÓN</p>

    <a
      th:href="@{/usuarios}"
      class="menu-item"
      th:classappend="${paginaActual == 'usuarios'} ? 'active' : ''"
    >
      <span class="icon">
        <i class="fa-solid fa-user-gear"></i>
      </span>

      <span>Usuarios</span>
    </a>

    <a
      th:href="@{/roles}"
      class="menu-item"
      th:classappend="${paginaActual == 'roles'} ? 'active' : ''"
    >
      <span class="icon">
        <i class="fa-solid fa-gear"></i>
      </span>

      <span>Roles</span>
    </a>
  </nav>

  <!-- USUARIO -->
  <div class="sidebar-user">
    <div class="user-avatar">A</div>

    <div class="user-info">
      <strong>Administrador</strong>
      <span>Administrador</span>
    </div>

    <button class="logout-button">⇥</button>
  </div>
</aside>
