<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Actualizar cliente | OmniModa</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" th:href="@{/css/sweetalert2.min.css}" />
    <link rel="stylesheet" th:href="@{/css/actualizar_cliente.css}" />
    <link rel="stylesheet" th:href="@{/css/dashboard.css}" />
  </head>
  <body>
    <div class="app">
      <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
      <main class="main-content">
        <header class="page-header">
          <div>
            <h2>Actualizar cliente</h2>
            <p>Modifica la información del cliente seleccionado.</p>
          </div>
          <aside th:replace="~{fragments/user_profile :: user_profile}"></aside>
        </header>
        <a th:href="@{/clientes}" class="back-link">
          <i class="fa-solid fa-arrow-left"></i>
          Volver a clientes
        </a>
        <section class="form-card">
          <div class="form-header">
            <div class="form-icon">
              <i class="fa-solid fa-user-pen"></i>
            </div>
            <div>
              <h3>Información del cliente</h3>
              <p>Actualiza los datos necesarios del cliente.</p>
            </div>
          </div>
          <form
            th:action="@{/clientes/actualizar}"
            th:object="${cliente}"
            class="update-client"
            method="post"
            autocomplete="off"
          >
            <div class="form-grid">
              <div class="form-group">
                <label for="documento">
                  Documento identidad
                  <span>*</span>
                </label>
                <div class="input-wrapper">
                  <i class="fa-solid fa-id-card"></i>
                  <input
                    type="text"
                    id="documento"
                    th:field="*{documento}"
                    readonly
                  />
                </div>
              </div>
              <div class="form-group">
                <label>
                  Tipo de cliente
                  <span>*</span>
                </label>
                <div class="custom-select" id="tipoClienteCustom">
                  <select
                    id="tipoCliente"
                    th:field="*{tipoCliente}"
                    class="real-select"
                    required
                  >
                    <option value="" disabled>
                      Seleccionar tipo de cliente
                    </option>
                    <option
                      th:each="tipo : ${tiposCliente}"
                      th:value="${tipo.idTipoCliente}"
                      th:text="${tipo.tipo}"
                    ></option>
                  </select>
                  <button type="button" class="custom-select-trigger">
                    <span class="custom-select-left">
                      <span class="custom-select-icon">
                        <i class="fa-solid fa-users"></i>
                      </span>
                      <span class="custom-select-text" id="tipoClienteText">
                        Seleccionar tipo de cliente
                      </span>
                    </span>
                    <i class="fa-solid fa-chevron-down custom-select-arrow"></i>
                  </button>
                  <div class="custom-select-dropdown">
                    <div
                      class="custom-select-options"
                      id="tipoClienteOptions"
                    ></div>
                  </div>
                </div>
              </div>
              <div class="form-group">
                <label for="nombreCompleto">
                  Nombre completo
                  <span>*</span>
                </label>
                <div class="input-wrapper">
                  <i class="fa-regular fa-user"></i>
                  <input
                    type="text"
                    id="nombreCompleto"
                    th:field="*{nombreCompleto}"
                    placeholder="Ej. Juan Pérez"
                    required
                  />
                </div>
              </div>
              <div class="form-group">
                <label for="correo">
                  Correo electrónico
                  <span>*</span>
                </label>
                <div class="input-wrapper">
                  <i class="fa-regular fa-envelope"></i>
                  <input
                    type="email"
                    id="correo"
                    th:field="*{correo}"
                    placeholder="correo@ejemplo.com"
                    required
                  />
                </div>
              </div>
              <div class="form-group phone-group">
                <label for="telefonoNumero">
                  Teléfono
                  <span>*</span>
                </label>
                <div class="phone-wrapper">
                  <div class="phone-prefix">
                    <button
                      type="button"
                      class="country-selector"
                      id="countrySelector"
                    >
                      <span id="selectedFlag"> 🇨🇴 </span>
                      <span id="selectedDialCode"> +57 </span>
                      <i class="fa-solid fa-chevron-down"></i>
                    </button>
                    <div class="country-dropdown" id="countryDropdown">
                      <div class="country-search">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input
                          type="text"
                          id="countrySearch"
                          placeholder="Buscar país..."
                        />
                      </div>
                      <div class="country-list" id="countryList"></div>
                    </div>
                  </div>
                  <div class="phone-input-wrapper">
                    <i class="fa-solid fa-phone"></i>
                    <input
                      type="tel"
                      id="telefonoNumero"
                      placeholder="300 000 0000"
                      required
                    />
                  </div>
                </div>
                <input type="hidden" id="telefono" th:field="*{telefono}" />
              </div>
            </div>
            <div class="form-footer">
              <a th:href="@{/clientes}" class="btn-secondary"> Cancelar </a>
              <button type="submit" class="btn-primary">
                <i class="fa-solid fa-rotate"></i>
                Actualizar cliente
              </button>
            </div>
          </form>
        </section>
      </main>
    </div>
    <script th:src="@{/js/paises.js}"></script>
    <script th:src="@{/js/tipocliente.js}"></script>
    <script th:inline="javascript">
      const telefonoCompleto = /*[[${cliente.telefono}]]*/ "";
      if (telefonoCompleto) {
        const telefonoInput = document.getElementById("telefonoNumero");
        const hiddenTelefono = document.getElementById("telefono");
        const selectedFlag = document.getElementById("selectedFlag");
        const selectedDialCode = document.getElementById("selectedDialCode");
        const telefonoLimpio = telefonoCompleto.trim();
        const paisEncontrado = [...countries]
          .sort((a, b) => b.code.length - a.code.length)
          .find((country) => telefonoLimpio.startsWith(country.code));
        if (paisEncontrado) {
          selectedCountry = paisEncontrado;
          selectedFlag.textContent = paisEncontrado.flag;
          selectedDialCode.textContent = paisEncontrado.code;
          telefonoInput.value = telefonoLimpio
            .substring(paisEncontrado.code.length)
            .trim();
        } else {
          telefonoInput.value = telefonoLimpio;
        }
        hiddenTelefono.value = telefonoLimpio;
      }
    </script>
    <script th:src="@{/js/sweetalert2.all.min.js}"></script>
    <script th:src="@{/js/alertas.js}"></script>
  </body>
</html>
