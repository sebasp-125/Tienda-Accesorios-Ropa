<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Actualizar Venta | OmniModa</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" th:href="@{/css/sweetalert2.min.css}" />
    <link rel="stylesheet" th:href="@{/css/dashboard.css}" />
    <link rel="stylesheet" th:href="@{/css/clientes.css}" />
    <link rel="stylesheet" th:href="@{/css/actualizar_cliente.css}" />
    <link rel="stylesheet" th:href="@{/css/ventas.css}" />

    <style>
      .product-picker-card {
        background: #f8fafc;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 20px;
        margin-top: 24px;
        margin-bottom: 24px;
      }

      .picker-grid {
        display: grid;
        grid-template-columns: 2fr 1fr auto;
        gap: 14px;
        align-items: flex-end;
      }

      .items-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 16px;
      }

      .items-table th {
        background: #fafbfc;
        padding: 12px 16px;
        font-size: 11px;
        text-align: left;
        color: #64748b;
        border-bottom: 1px solid var(--border);
      }

      .items-table td {
        padding: 14px 16px;
        font-size: 13px;
        border-bottom: 1px solid #f1f5f9;
        vertical-align: middle;
      }

      .total-checkout-box {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 18px;
        padding: 18px 20px;
        background: #f8fafc;
        border-radius: 10px;
        margin-top: 20px;
      }

      .total-checkout-box span {
        font-size: 15px;
        color: #64748b;
        font-weight: 600;
      }

      .total-checkout-box strong {
        font-size: 24px;
        font-weight: 800;
        color: #0f172a;
      }
    </style>
  </head>

  <body>
    <div class="app">
      <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

      <main class="main-content">
        <header class="page-header">
          <div>
            <h2>Actualizar Venta #<span th:text="${venta.idVentas}">1</span></h2>
            <p>Modifica el estado, cliente, fecha o productos de la transacción.</p>
          </div>
          <aside th:replace="~{fragments/user_profile :: user_profile}"></aside>
        </header>

        <a th:href="@{/ventas}" class="back-link">
          <i class="fa-solid fa-arrow-left"></i>
          Volver a ventas
        </a>

        <section class="form-card">
          <div class="form-header">
            <div class="form-icon" style="background: #fdfbf7; color: var(--primary-dark);">
              <i class="fa-solid fa-pen-to-square"></i>
            </div>
            <div>
              <h3>Edición de la Venta #<span th:text="${venta.idVentas}"></span></h3>
              <p>Realiza los cambios necesarios en el pedido.</p>
            </div>
          </div>

          <form id="formActualizarVenta" th:action="@{/ventas/actualizar}" method="post" autocomplete="off">
            <input type="hidden" name="idVentas" th:value="${venta.idVentas}" />

            <div class="form-grid">
              <!-- CLIENTE -->
              <div class="form-group">
                <label for="clienteDocumento">
                  Cliente <span>*</span>
                </label>
                <div class="input-wrapper">
                  <i class="fa-solid fa-user"></i>
                  <select id="clienteDocumento" name="clienteDocumento" required style="border:0; outline:0; width:100%; background:transparent; font-family:inherit; font-size:13px;">
                    <option
                      th:each="c : ${clientes}"
                      th:value="${c.documento}"
                      th:text="${c.nombreCompleto + ' (' + c.documento + ')'}"
                      th:selected="${venta.cliente != null and venta.cliente.documento == c.documento}"
                    ></option>
                  </select>
                </div>
              </div>

              <!-- FECHA -->
              <div class="form-group">
                <label for="fecha">
                  Fecha de la venta <span>*</span>
                </label>
                <div class="input-wrapper">
                  <i class="fa-regular fa-calendar"></i>
                  <input
                    type="date"
                    id="fecha"
                    name="fecha"
                    th:value="${venta.fecha}"
                    required
                  />
                </div>
              </div>

              <!-- ESTADO -->
              <div class="form-group">
                <label for="estadoId">
                  Estado de la venta <span>*</span>
                </label>
                <div class="input-wrapper">
                  <i class="fa-solid fa-sliders"></i>
                  <select id="estadoId" name="estadoId" required style="border:0; outline:0; width:100%; background:transparent; font-family:inherit; font-size:13px;">
                    <option
                      th:each="est : ${estados}"
                      th:value="${est.idEstado}"
                      th:text="${est.tipo}"
                      th:selected="${venta.estado != null and venta.estado.idEstado == est.idEstado}"
                    ></option>
                  </select>
                </div>
              </div>
            </div>

            <!-- PRODUCTOS EN LA VENTA -->
            <div class="product-picker-card">
              <h4 style="font-size: 15px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px;">
                <i class="fa-solid fa-box" style="color: var(--primary-dark);"></i>
                Productos asociados a la venta
              </h4>

              <div class="picker-grid">
                <div class="form-group" style="margin: 0;">
                  <label for="selectProducto">Agregar otro producto</label>
                  <div class="input-wrapper">
                    <i class="fa-solid fa-shirt"></i>
                    <select id="selectProducto" style="border:0; outline:0; width:100%; background:transparent; font-family:inherit; font-size:13px;">
                      <option value="" disabled selected>Seleccionar producto...</option>
                      <option
                        th:each="prod : ${productos}"
                        th:value="${prod.codigo}"
                        th:data-nombre="${prod.nombre}"
                        th:data-precio="${prod.precio}"
                        th:data-stock="${prod.stockDisponible}"
                        th:text="${prod.nombre + ' [' + prod.codigo + '] - $' + #numbers.formatDecimal(prod.precio, 1, 2) + ' (Stock: ' + prod.stockDisponible + ')'}"
                      ></option>
                    </select>
                  </div>
                </div>

                <div class="form-group" style="margin: 0;">
                  <label for="inputCantidad">Cantidad</label>
                  <div class="input-wrapper">
                    <i class="fa-solid fa-hashtag"></i>
                    <input
                      type="number"
                      id="inputCantidad"
                      value="1"
                      min="1"
                      placeholder="Cant."
                    />
                  </div>
                </div>

                <div>
                  <button type="button" class="btn-primary" onclick="agregarProductoALaLista()" style="height: 46px;">
                    <i class="fa-solid fa-plus"></i> Agregar
                  </button>
                </div>
              </div>

              <!-- TABLA DINÁMICA DE ITEMS -->
              <table class="items-table" style="margin-top: 20px;">
                <thead>
                  <tr>
                    <th>CÓDIGO</th>
                    <th>PRODUCTO</th>
                    <th>PRECIO UNIT.</th>
                    <th>CANTIDAD</th>
                    <th>SUBTOTAL</th>
                    <th>ACCIÓN</th>
                  </tr>
                </thead>
                <tbody id="itemsTableBody">
                  <!-- Filas iniciales cargadas por JS -->
                </tbody>
              </table>

              <!-- RESUMEN DE TOTAL -->
              <div class="total-checkout-box">
                <span>Total actualizado:</span>
                <strong id="displayTotalVenta">$0.00</strong>
              </div>
            </div>

            <div class="form-footer">
              <a th:href="@{/ventas}" class="btn-secondary"> Cancelar </a>
              <button type="submit" class="btn-primary" id="btnActualizarVenta">
                <i class="fa-solid fa-check"></i>
                Actualizar venta
              </button>
            </div>
          </form>
        </section>
      </main>
    </div>

    <script th:src="@{/js/sweetalert2.all.min.js}"></script>
    <script th:inline="javascript">
      /*<![CDATA[*/
      // Cargar items actuales de la venta
      let itemsVenta = [];

      /*[# th:each="d : ${detalles}"]*/
      itemsVenta.push({
        codigo: /*[[${d.producto.codigo}]]*/ '',
        nombre: /*[[${d.producto.nombre}]]*/ '',
        precio: /*[[${d.precioUnitario}]]*/ 0,
        cantidad: /*[[${d.cantidad}]]*/ 1,
        subtotal: /*[[${d.subtotal}]]*/ 0
      });
      /*[/]*/

      function agregarProductoALaLista() {
        const select = document.getElementById("selectProducto");
        const selectedOpt = select.options[select.selectedIndex];
        if (!selectedOpt || !selectedOpt.value) {
          Swal.fire({
            icon: "warning",
            title: "Producto requerido",
            text: "Selecciona un producto para agregar.",
            confirmButtonColor: "#9d824f"
          });
          return;
        }

        const codigo = selectedOpt.value;
        const nombre = selectedOpt.getAttribute("data-nombre");
        const precio = parseFloat(selectedOpt.getAttribute("data-precio")) || 0;

        const inputCant = document.getElementById("inputCantidad");
        const cantidad = parseInt(inputCant.value) || 1;

        if (cantidad <= 0) {
          Swal.fire({
            icon: "warning",
            title: "Cantidad inválida",
            text: "La cantidad debe ser mayor a 0.",
            confirmButtonColor: "#9d824f"
          });
          return;
        }

        const existente = itemsVenta.find(i => i.codigo === codigo);

        if (existente) {
          existente.cantidad += cantidad;
          existente.subtotal = existente.cantidad * existente.precio;
        } else {
          itemsVenta.push({
            codigo: codigo,
            nombre: nombre,
            precio: precio,
            cantidad: cantidad,
            subtotal: precio * cantidad
          });
        }

        renderItems();
        inputCant.value = 1;
        select.selectedIndex = 0;
      }

      function removerItem(codigo) {
        itemsVenta = itemsVenta.filter(i => i.codigo !== codigo);
        renderItems();
      }

      function renderItems() {
        const tbody = document.getElementById("itemsTableBody");
        const displayTotal = document.getElementById("displayTotalVenta");

        if (itemsVenta.length === 0) {
          tbody.innerHTML = `
            <tr id="emptyItemsRow">
              <td colspan="6" style="text-align: center; color: #94a3b8; padding: 24px;">
                No hay productos en esta venta. Selecciona uno arriba y agrégalo.
              </td>
            </tr>
          `;
          displayTotal.textContent = "$0.00";
          return;
        }

        let html = "";
        let total = 0;

        itemsVenta.forEach(i => {
          total += i.subtotal;
          html += `
            <tr>
              <td><strong>${i.codigo}</strong>
                <input type="hidden" name="codigos" value="${i.codigo}" />
              </td>
              <td>${i.nombre}</td>
              <td>$${i.precio.toLocaleString('es-CO', { minimumFractionDigits: 2 })}</td>
              <td>
                ${i.cantidad}
                <input type="hidden" name="cantidades" value="${i.cantidad}" />
              </td>
              <td><strong>$${i.subtotal.toLocaleString('es-CO', { minimumFractionDigits: 2 })}</strong></td>
              <td>
                <button type="button" class="action-button delete" onclick="removerItem('${i.codigo}')" title="Eliminar producto">
                  <i class="fa-solid fa-trash"></i>
                </button>
              </td>
            </tr>
          `;
        });

        tbody.innerHTML = html;
        displayTotal.textContent = "$" + total.toLocaleString('es-CO', { minimumFractionDigits: 2 });
      }

      // Inicializar render al cargar
      document.addEventListener("DOMContentLoaded", () => {
        renderItems();
      });

      // Confirmación al actualizar
      document.getElementById("formActualizarVenta").addEventListener("submit", function(e) {
        if (itemsVenta.length === 0) {
          e.preventDefault();
          Swal.fire({
            icon: "warning",
            title: "Productos requeridos",
            text: "La venta debe tener al menos un producto asociado.",
            confirmButtonColor: "#9d824f"
          });
          return;
        }

        Swal.fire({
          toast: true,
          position: "top-end",
          icon: "success",
          title: "Venta actualizada exitosamente",
          showConfirmButton: false,
          timer: 1500
        });
      });
      /*]]>*/
    </script>
  </body>
</html>
